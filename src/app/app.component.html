<button (click)="playsound()" >Play for aria live announcer</button>
<div></div>
<cdk-accordion>

  <cdk-accordion-item #item="cdkAccordionItem">

    <button (click)="item.toggle()">
      Angular
    </button>

      <div *ngIf="item.expanded">
        Angular is a frontend framework.
      </div>

  </cdk-accordion-item>

</cdk-accordion>

<br><br>
<cdk-accordion [multi]="true">

  <cdk-accordion-item #item1="cdkAccordionItem">

    <button (click)="item1.toggle()">
      Angular
    </button>

      <div *ngIf="item1.expanded">
        Angular is a frontend framework.
      </div>

  </cdk-accordion-item>

  <cdk-accordion-item #item2="cdkAccordionItem">

    <button (click)="item2.toggle()">
      React
    </button>

      <div *ngIf="item2.expanded">
        React content.
      </div>

  </cdk-accordion-item>
  <div> {{title}} </div>
  <button [cdkCopyToClipboard]="title" [cdkCopyToClipboardAttempts]="4" (cdkCopyToClipboardCopied)="onCop($event)">Copy</button>

</cdk-accordion>
